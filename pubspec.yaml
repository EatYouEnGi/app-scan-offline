name: app_scan
description: Ứng dụng scan tài liệu cá nhân ngoại tuyến cho iOS và Android (Quét AI tự bắt mép giấy, chỉnh góc, bộ lọc, OCR Tiếng Việt/Anh & chữ viết tay, PDF nhiều trang, chia sẻ đa ứng dụng).
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Trình quét tài liệu AI gốc trên thiết bị (Google ML Kit Document Scanner & Apple VisionKit)
  cunning_document_scanner: ^3.1.0

  # Camera trực tiếp (theo dõi đa giác tài liệu thời gian thực không cần khung) & Chọn ảnh/tệp
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # OCR trên thiết bị kết hợp Native AI OCR (Tesseract LSTM Tiếng Việt & Apple Vision)
  google_mlkit_text_recognition: ^0.13.1

  # Xử lý ảnh, tạo PDF, kết xuất và in/xem trước PDF
  image: ^4.2.0
  pdf: ^3.11.1
  printing: ^5.13.3

  # Lưu trữ cục bộ & chia sẻ qua ứng dụng khác (Zalo, Gmail, Drive, Messenger...)
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2

  # Khóa sinh trắc học
  local_auth: ^2.3.0

  # Tiện ích & Chuẩn hóa Unicode NFC tiếng Việt
  uuid: ^4.5.0
  intl: any
  collection: ^1.18.0
  unorm_dart: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: assets/branding/scand_icon.png
  min_sdk_android: 29
  remove_alpha_ios: true
  background_color_ios: "#0F1B3D"
  adaptive_icon_background: "#0F1B3D"
  adaptive_icon_foreground: assets/branding/scand_foreground.png

# Native Splash Screen ScanD (hiển thị ngay khi mở app, trước khi Flutter khởi động)
flutter_native_splash:
  color: "#0F1B3D"
  image: assets/branding/scand_splash.png
  android_12:
    color: "#0F1B3D"
    image: assets/branding/scand_splash_android12.png
    icon_background_color: "#0F1B3D"
  ios: true
  android: true
  web: false
  fullscreen: false
flutter:
  uses-material-design: true

  assets:
    - assets/tessdata/
    - assets/branding/
    - assets/fonts/

  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
