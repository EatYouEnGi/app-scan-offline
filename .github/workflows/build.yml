name: Build Android APK & iOS IPA (App Scan Offline)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. KIỂM THỬ NGHIỆM THU & BUILD ANDROID APK ĐÃ KÝ (SIGNED APK)
  # ============================================================================
  build-android:
    name: Build Signed Android APK (Android 10+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap missing platform wrapper files while keeping custom native code
        run: |
          cp -r android /tmp/custom_android
          flutter create . --platforms=android,ios --org com.appscan.offline --project-name app_scan
          cp -r /tmp/custom_android/* android/
          flutter pub get

      - name: Run Acceptance & 30-Sample Benchmark Tests
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev
          flutter test test/scanner_acceptance_test.dart

      - name: Generate Release Keystore & key.properties (Signed APK)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks
            cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release-key.jks
          EOF
          else
            keytool -genkey -v \
              -keystore android/app/release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias appscan_key \
              -storepass appscan2026 \
              -keypass appscan2026 \
              -dname "CN=App Scan Personal, OU=Mobile, O=Personal, L=Hanoi, S=HN, C=VN"
            cat <<EOF > android/key.properties
          storePassword=appscan2026
          keyPassword=appscan2026
          keyAlias=appscan_key
          storeFile=release-key.jks
          EOF
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Signed Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppScan-Android-Signed-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ============================================================================
  # 2. BUILD BẢN PHÂN PHỐI iOS (iOS 16+ AD-HOC / IPA) TRÊN MÁY CHỦ macOS
  # ============================================================================
  build-ios:
    name: Build iOS 16+ IPA (macOS Xcode)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap iOS Xcode project & restore custom Podfile/Info.plist/Swift Vision bridge
        run: |
          cp -r ios /tmp/custom_ios
          flutter create . --platforms=ios --org com.appscan.offline --project-name app_scan
          cp /tmp/custom_ios/Podfile ios/Podfile
          cp /tmp/custom_ios/Runner/Info.plist ios/Runner/Info.plist
          cp /tmp/custom_ios/Runner/AppDelegate.swift ios/Runner/AppDelegate.swift
          flutter pub get

      - name: Install CocoaPods (GoogleMLKit/TextRecognition Offline Latin Model)
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS Release Bundle
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into AppScan-iOS.ipa
        run: |
          mkdir -p build/ios/ipa_out/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa_out/Payload/
          cd build/ios/ipa_out
          zip -r -9 AppScan-iOS-16Plus.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppScan-iOS-IPA
          path: build/ios/ipa_out/AppScan-iOS-16Plus.ipa
          retention-days: 30

